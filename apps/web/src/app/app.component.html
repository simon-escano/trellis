<div class="flex w-screen h-screen overflow-hidden bg-[#07090E] text-white font-sans antialiased select-none relative">

  <!-- View 1: Homepage View (with Left Topic History Sidebar & LLM Prompt Container) -->
  <app-home *ngIf="store.currentView() === 'home'" class="w-full h-full"></app-home>

  <!-- View 2: Fullscreen Topic Concept Map View (Sidebar hidden for maximum immersive room) -->
  <ng-container *ngIf="store.currentView() === 'canvas'">
    
    <!-- Fullscreen Concept Graph Canvas with embedded Top Left Flex Header & Inspector -->
    <main class="w-full h-full relative z-0">
      <app-canvas></app-canvas>
    </main>

  </ng-container>

  <!-- Global Modal: PDF / Document Ingestion Sheet -->
  <app-ingest-modal 
    *ngIf="isIngestModalOpen()" 
    (closeModal)="closeIngestModal()">
  </app-ingest-modal>

</div>
