<header class="h-14 border-b border-trellis-border flex items-center justify-between px-6 glass-panel z-30 select-none">
  
  <!-- Logo & Title -->
  <div class="flex items-center space-x-3">
    <div class="w-8 h-8 rounded-lg bg-trellis-accent/10 border border-trellis-accent/30 flex items-center justify-center text-trellis-accent shadow-md shadow-trellis-accent/5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <div class="flex items-baseline space-x-2">
      <span class="font-bold tracking-tight text-base text-trellis-text-primary">Trellis</span>
      <span class="text-[10px] font-mono tracking-wider px-2 py-0.5 rounded-full bg-trellis-accent/10 text-trellis-accent border border-trellis-accent/20">
        Concept Engine
      </span>
    </div>
  </div>

  <!-- Center Document Selector & Active Status -->
  <div class="flex items-center space-x-3">
    <div *ngIf="store.documents().length > 0; else emptyDocSelector" class="flex items-center space-x-2">
      <div class="relative">
        <select (change)="onSelectDoc($event)" 
                [value]="store.selectedDocumentId() || ''"
                class="appearance-none pl-3 pr-8 py-1.5 rounded-lg bg-trellis-surface border border-trellis-border hover:border-trellis-border-active focus:border-trellis-accent focus:outline-none text-xs font-medium text-trellis-text-primary cursor-pointer transition-all max-w-[260px] truncate">
          <option *ngFor="let doc of store.documents()" [value]="doc.id">
            {{ doc.title }}
          </option>
        </select>
        <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-trellis-text-muted">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Active Status Dot -->
      <div *ngIf="store.activeDocument() as doc" class="flex items-center space-x-1.5 px-2 py-1 rounded-md bg-[#070A0F]/60 border border-trellis-border/50 text-[11px] font-mono">
        <span [ngClass]="getStatusDotClass(doc.status)" class="w-2 h-2 rounded-full"></span>
        <span class="text-trellis-text-muted capitalize">{{ doc.status | lowercase }}</span>
      </div>
    </div>

    <ng-template #emptyDocSelector>
      <span class="text-xs text-trellis-text-muted italic">No documents ingested</span>
    </ng-template>
  </div>

  <!-- Right Metrics & Ingestion Trigger -->
  <div class="flex items-center space-x-4">
    
    <!-- Realtime System Metrics Pills -->
    <div *ngIf="store.metrics() as m" class="hidden md:flex items-center space-x-2 font-mono text-[11px]">
      <div class="px-2.5 py-1 rounded-lg bg-trellis-surface border border-trellis-border flex items-center space-x-1.5">
        <span class="text-trellis-text-muted">Docs:</span>
        <span class="font-bold text-trellis-text-primary">{{ m.totalDocuments }}</span>
      </div>
      <div class="px-2.5 py-1 rounded-lg bg-trellis-accent/10 border border-trellis-accent/20 flex items-center space-x-1.5">
        <span class="text-trellis-accent font-bold">{{ m.processedCount }}</span>
        <span class="text-trellis-accent/70">Done</span>
      </div>
      <div *ngIf="m.queuedCount > 0" class="px-2.5 py-1 rounded-lg bg-trellis-amber/10 border border-trellis-amber/20 flex items-center space-x-1.5">
        <span class="text-trellis-amber font-bold">{{ m.queuedCount }}</span>
        <span class="text-trellis-amber/70">Queued</span>
      </div>
      <div *ngIf="m.failedCount > 0" class="px-2.5 py-1 rounded-lg bg-trellis-rose/10 border border-trellis-rose/20 flex items-center space-x-1.5">
        <span class="text-trellis-rose font-bold">{{ m.failedCount }}</span>
        <span class="text-trellis-rose/70">Failed</span>
      </div>
    </div>

    <!-- Add Document Button -->
    <button (click)="openIngestModal.emit()" 
            class="px-3.5 py-1.5 rounded-xl text-xs font-bold text-black bg-trellis-accent hover:bg-trellis-accent/90 transition-all flex items-center space-x-1.5 shadow-lg shadow-trellis-accent/15 cursor-pointer">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
      </svg>
      <span>Ingest Document</span>
    </button>
  </div>
</header>
