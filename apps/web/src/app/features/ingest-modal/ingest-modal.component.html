<div *ngIf="isOpen" 
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md animate-in fade-in duration-200">
  
  <!-- Backdrop Click Area -->
  <div (click)="onClose()" class="absolute inset-0"></div>

  <!-- Modal Container -->
  <div class="relative w-full max-w-2xl rounded-2xl glass-panel border border-trellis-border bg-[#0D1420] shadow-2xl overflow-hidden z-10 max-h-[90vh] flex flex-col">
    
    <!-- Modal Header -->
    <div class="p-6 border-b border-trellis-border flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-trellis-accent/15 border border-trellis-accent/30 flex items-center justify-center text-trellis-accent">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-trellis-text-primary">Ingest Document &amp; Map Knowledge</h2>
          <p class="text-xs text-trellis-text-muted">Transform raw prose into an interactive visual graph</p>
        </div>
      </div>

      <button (click)="onClose()" 
              class="p-1.5 rounded-lg text-trellis-text-muted hover:text-trellis-text-primary hover:bg-trellis-surface transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body (Scrollable) -->
    <div class="p-6 space-y-6 overflow-y-auto flex-1">
      
      <!-- 1-Click Multi-Persona Demo Presets -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-mono uppercase tracking-wider text-trellis-text-muted font-semibold">
            One-Click Demo Presets
          </label>
          <span class="text-[11px] text-trellis-accent font-medium">Instant Load</span>
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <button *ngFor="let preset of presets" 
                  (click)="selectPreset(preset)" 
                  type="button"
                  [ngClass]="selectedPresetId() === preset.id ? 'border-trellis-accent bg-trellis-accent/10 shadow-lg shadow-trellis-accent/5' : 'border-trellis-border bg-[#070A0F]/60 hover:border-trellis-border-active hover:bg-trellis-surface/60'"
                  class="p-3 rounded-xl border text-left transition-all flex flex-col justify-between group">
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-lg">{{ preset.personaIcon }}</span>
                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-trellis-surface border border-trellis-border text-trellis-text-muted">
                  {{ preset.categoryBadge }}
                </span>
              </div>
              <h4 class="text-xs font-bold text-trellis-text-primary group-hover:text-trellis-accent transition-colors line-clamp-1">
                {{ preset.persona }}
              </h4>
            </div>
            <p class="text-[11px] text-trellis-text-muted line-clamp-2 mt-1">
              {{ preset.title }}
            </p>
          </button>
        </div>
      </div>

      <!-- Ingestion Form Fields -->
      <form (ngSubmit)="onSubmit()" id="ingestForm" class="space-y-4">
        
        <!-- Document Title Field -->
        <div class="space-y-1.5">
          <label class="text-xs font-mono uppercase tracking-wider text-trellis-text-muted flex justify-between">
            <span>Document Title</span>
            <span class="text-trellis-text-muted/60">{{ title.length }}/120</span>
          </label>
          <input type="text" 
                 [(ngModel)]="title" 
                 name="title" 
                 maxlength="120"
                 placeholder="e.g., Quantum Computing &amp; Superconducting Qubits" 
                 required
                 class="w-full px-3.5 py-2.5 rounded-xl bg-[#070A0F] border border-trellis-border focus:border-trellis-accent focus:outline-none text-sm text-trellis-text-primary placeholder:text-trellis-text-muted/50 transition-all font-sans" />
        </div>

        <!-- Raw Content Textarea Field -->
        <div class="space-y-1.5">
          <label class="text-xs font-mono uppercase tracking-wider text-trellis-text-muted flex justify-between">
            <span>Raw Text or Article Prose</span>
            <span class="text-trellis-text-muted/60">{{ rawContent.length }} chars</span>
          </label>
          <textarea [(ngModel)]="rawContent" 
                    name="rawContent" 
                    rows="7" 
                    placeholder="Paste full article, RFC proposal, study summary, or literature excerpt here..." 
                    required
                    class="w-full px-3.5 py-2.5 rounded-xl bg-[#070A0F] border border-trellis-border focus:border-trellis-accent focus:outline-none text-xs leading-relaxed text-trellis-text-primary placeholder:text-trellis-text-muted/50 transition-all font-mono"></textarea>
        </div>
      </form>
    </div>

    <!-- Modal Footer -->
    <div class="p-5 border-t border-trellis-border bg-[#070A0F]/50 flex items-center justify-between">
      <span class="text-[11px] text-trellis-text-muted flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-trellis-accent"></span>
        <span>Runs with zero-cost mock analyzer if no API key is supplied</span>
      </span>

      <div class="flex items-center space-x-2">
        <button type="button" 
                (click)="onClose()" 
                class="px-4 py-2 rounded-xl text-xs font-medium text-trellis-text-muted hover:text-trellis-text-primary hover:bg-trellis-surface border border-transparent transition-all">
          Cancel
        </button>
        <button type="submit" 
                form="ingestForm"
                [disabled]="!title.trim() || !rawContent.trim() || store.isIngesting()"
                class="px-5 py-2 rounded-xl text-xs font-bold text-black bg-trellis-accent hover:bg-trellis-accent/90 disabled:opacity-50 transition-all flex items-center space-x-2 shadow-lg shadow-trellis-accent/20">
          <span *ngIf="store.isIngesting()" class="w-3.5 h-3.5 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
          <span>{{ store.isIngesting() ? 'Synthesizing...' : 'Synthesize Graph' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
