<div *ngIf="isOpen"
  [class.backdrop-enter]="!isClosing()"
  [class.backdrop-leave]="isClosing()"
  class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-xl select-none">

  <!-- Backdrop Click Area -->
  <div (click)="onClose()" class="absolute inset-0"></div>

  <!-- Modal Container -->
  <div
    [class.modal-enter]="!isClosing()"
    [class.modal-leave]="isClosing()"
    class="relative w-full max-w-2xl rounded-3xl apple-glass shadow-2xl overflow-hidden z-10 max-h-[92vh] flex flex-col transition-colors">

    <!-- Modal Header -->
    <div class="p-4 sm:p-5 border-b border-slate-200 dark:border-white/[0.08] flex items-center justify-between flex-shrink-0">
      <div class="flex items-center space-x-3">
        <svg viewBox="0 0 1080 812.94" fill="currentColor" class="h-6 sm:h-7 w-auto text-emerald-500 dark:text-emerald-400 shrink-0">
          <path d="m1070.02,109.66c-27.08-75.16-105.85-121.08-184.52-107.19-64.8,11.44-112.65,57.53-130.42,114.32-12.95,41.39-45.75,73.54-87.41,85.56l-91.89,26.5c-23.37,6.74-48.18,6.74-71.55,0l-91.9-26.5c-41.56-11.99-74.48-43.95-87.32-85.26C307.16,59.67,258.61,13.23,193.14,2.24,114.15-11.02,35.59,35.83,9.33,111.49c-31.74,91.44,20.46,189.29,112.27,214.89,54.9,15.31,111.04,1.18,151.63-32.9,33.4-28.05,77.9-38.98,119.8-26.9l20.09,5.79c55.28,15.94,93.34,66.53,93.34,124.07v3.83c0,43.34-21.75,83.77-57.91,107.65-49.79,32.87-80.85,91.82-73.74,157.39,8.62,79.47,74.79,142.33,154.58,147.29,96.61,6.01,176.83-70.57,176.83-165.88,0-57.36-29.06-107.93-73.25-137.8-36.44-24.63-59.41-64.7-59.41-108.69v-3.79c0-57.53,38.06-108.12,93.35-124.07l19.33-5.57c42.22-12.18,87.09-1.28,120.81,26.91,41.08,34.34,97.97,48.25,153.24,32.14,91.51-26.68,142.57-125.13,109.76-216.2Z"/>
        </svg>
        <div>
          <h2 class="text-sm sm:text-base font-medium text-slate-900 dark:text-white tracking-tight">Ingest Document &amp; Map Knowledge</h2>
          <p class="text-[11px] sm:text-xs text-slate-500 dark:text-white/50">Transform raw prose into an interactive visual graph</p>
        </div>
      </div>

      <button (click)="onClose()"
        class="w-7 h-7 rounded-full apple-button-secondary flex items-center justify-center text-slate-500 dark:text-white/50 hover:text-slate-900 dark:hover:text-white transition-all cursor-pointer">
        <ng-icon name="lucideX" class="text-xs"></ng-icon>
      </button>
    </div>

    <!-- Modal Body (Scrollable) -->
    <div class="p-4 sm:p-6 space-y-4 sm:space-y-5 overflow-y-auto flex-1 custom-scrollbar">

      <!-- 1-Click Multi-Persona Demo Presets -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-[10px] font-mono uppercase tracking-wider text-slate-500 dark:text-white/40 font-medium">
            One-Click Demo Presets
          </label>
          <span class="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium">Instant Load</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-2.5">
          <button *ngFor="let preset of presets" (click)="selectPreset(preset)" type="button"
            [ngClass]="selectedPresetId() === preset.id ? 'border-emerald-500/50 bg-emerald-500/10 shadow-md' : 'border-slate-200 dark:border-white/[0.06] bg-slate-100/70 dark:bg-black/20 hover:border-slate-300 dark:hover:border-white/[0.12] hover:bg-slate-200/60 dark:hover:bg-white/[0.03]'"
            class="p-2.5 sm:p-3 rounded-2xl border text-left transition-all flex flex-col justify-between group cursor-pointer">
            <div>
              <div class="flex items-center justify-between mb-1">
                <ng-icon [name]="preset.iconName" class="text-emerald-600 dark:text-emerald-400 text-sm sm:text-base"></ng-icon>
                <span
                  class="text-[9px] font-mono px-1.5 py-0.5 rounded-full bg-slate-200/60 dark:bg-white/[0.06] border border-slate-300/60 dark:border-white/[0.08] text-slate-600 dark:text-white/60">
                  {{ preset.categoryBadge }}
                </span>
              </div>
              <h4 class="text-xs font-medium text-slate-800 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors line-clamp-1">
                {{ preset.persona }}
              </h4>
            </div>
            <p class="text-[10px] sm:text-[11px] text-slate-500 dark:text-white/50 line-clamp-2 mt-1 leading-snug">
              {{ preset.title }}
            </p>
          </button>
        </div>
      </div>

      <!-- Ingestion Form Fields -->
      <form (ngSubmit)="onSubmit()" id="ingestForm" class="space-y-3.5 sm:space-y-4">

        <!-- Document Title Field -->
        <div class="space-y-1 sm:space-y-1.5">
          <label class="text-[10px] font-mono uppercase tracking-wider text-slate-500 dark:text-white/40 flex justify-between">
            <span>Document Title</span>
            <span class="text-slate-400 dark:text-white/30">{{ title.length }}/120</span>
          </label>
          <input type="text" [(ngModel)]="title" name="title" maxlength="120"
            placeholder="e.g., Quantum Computing &amp; Superconducting Qubits" required
            class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl bg-slate-100 dark:bg-black/30 border border-slate-200 dark:border-white/[0.08] focus:border-emerald-500/50 focus:outline-none text-xs sm:text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-white/30 transition-all font-sans" />
        </div>

        <!-- Raw Content Textarea Field -->
        <div class="space-y-1 sm:space-y-1.5">
          <label class="text-[10px] font-mono uppercase tracking-wider text-slate-500 dark:text-white/40 flex justify-between">
            <span>Raw Text or Article Prose</span>
            <span class="text-slate-400 dark:text-white/30">{{ rawContent.length }} chars</span>
          </label>
          <textarea [(ngModel)]="rawContent" name="rawContent" rows="5"
            placeholder="Paste article, literature excerpt, study notes, or RFC text here..." required
            class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl bg-slate-100 dark:bg-black/30 border border-slate-200 dark:border-white/[0.08] focus:border-emerald-500/50 focus:outline-none text-xs leading-relaxed text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-white/30 transition-all font-mono"></textarea>
        </div>
      </form>
    </div>

    <!-- Modal Footer -->
    <div class="p-3.5 sm:p-4 border-t border-slate-200 dark:border-white/[0.08] bg-slate-50/80 dark:bg-black/20 flex flex-col sm:flex-row items-center justify-between gap-3 flex-shrink-0">
      <span class="text-[10px] sm:text-[11px] text-slate-500 dark:text-white/40 flex items-center space-x-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 dark:bg-emerald-400"></span>
        <span>Deterministic $0 mock extraction enabled</span>
      </span>

      <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
        <button type="button" (click)="onClose()"
          class="flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-white/60 hover:text-slate-900 dark:hover:text-white apple-button-secondary transition-all cursor-pointer">
          Cancel
        </button>
        <button type="submit" form="ingestForm" [disabled]="!title.trim() || !rawContent.trim() || store.isIngesting()"
          class="flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-medium text-black apple-button-primary disabled:opacity-50 transition-all flex items-center justify-center space-x-2 shadow-lg cursor-pointer">
          <span *ngIf="store.isIngesting()"
            class="w-3.5 h-3.5 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
          <span>{{ store.isIngesting() ? 'Synthesizing...' : 'Synthesize Graph' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
