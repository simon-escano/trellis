<div class="flex flex-col w-full h-full min-h-screen bg-[#07090E] text-white relative select-none overflow-hidden">
  
  <!-- Pure CSS Hardware-Accelerated Dense Dot Field Background (22px grid) -->
  <div class="absolute inset-0 pointer-events-none z-0 opacity-30"
       style="background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px); background-size: 22px 22px;">
  </div>

  <!-- Hidden File Input for PDF/Document Upload -->
  <input #fileInput type="file" accept=".pdf,.txt,.md,.json" (change)="onFileSelected($event)" class="hidden" />

  <!-- Top App Navigation Header -->
  <header class="h-14 w-full flex items-center justify-between px-6 border-b border-white/[0.06] apple-glass z-20 shrink-0">
    <div class="flex items-center space-x-2.5">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-white/10 to-white/20 border border-white/15 flex items-center justify-center text-white/90 shadow-sm">
        <ng-icon name="lucideLayers" class="w-4 h-4"></ng-icon>
      </div>
      <span class="font-semibold text-sm tracking-tight text-white/90">Trellis</span>
      <span class="text-[9px] font-mono uppercase px-1.5 py-0.5 rounded bg-white/10 text-white/60 tracking-wider">Beta</span>
    </div>

    <div class="flex items-center space-x-4">
      <a href="https://github.com" target="_blank" class="text-xs text-white/50 hover:text-white/80 transition-colors flex items-center space-x-1.5">
        <ng-icon name="lucideGlobe" class="w-3.5 h-3.5"></ng-icon>
        <span>Docs</span>
      </a>
      <div class="w-[1px] h-3.5 bg-white/10"></div>
      <div class="w-7 h-7 rounded-full bg-gradient-to-br from-white/20 to-white/5 border border-white/20 flex items-center justify-center text-xs font-medium text-white/80">
        S
      </div>
    </div>
  </header>

  <!-- Main Body Layout: Floating Rounded Left Sidebar + Center Hero Content -->
  <div class="flex-1 flex overflow-hidden z-10 p-3 md:p-4 gap-4">

    <!-- Floating Rounded Left Sidebar: Past Explored Topics & Examples -->
    <aside class="w-72 md:w-80 h-full border border-white/10 apple-glass rounded-3xl shadow-2xl flex flex-col p-4 shrink-0 overflow-hidden">
      
      <!-- Top Segmented Tabs -->
      <div class="flex items-center p-0.5 bg-white/[0.04] border border-white/[0.06] rounded-xl mb-3.5">
        <button (click)="selectedTab.set('my_projects')"
                [ngClass]="selectedTab() === 'my_projects' ? 'bg-white/10 text-white font-medium shadow-sm' : 'text-white/40 hover:text-white/70'"
                class="flex-1 py-1.5 text-xs rounded-lg transition-all flex items-center justify-center space-x-1.5">
          <ng-icon name="lucideLayoutGrid" class="w-3.5 h-3.5"></ng-icon>
          <span>My Projects</span>
        </button>
        <button (click)="selectedTab.set('examples')"
                [ngClass]="selectedTab() === 'examples' ? 'bg-white/10 text-white font-medium shadow-sm' : 'text-white/40 hover:text-white/70'"
                class="flex-1 py-1.5 text-xs rounded-lg transition-all flex items-center justify-center space-x-1.5">
          <ng-icon name="lucideSparkles" class="w-3.5 h-3.5"></ng-icon>
          <span>Examples</span>
        </button>
      </div>

      <!-- Search Input -->
      <div class="relative mb-3">
        <ng-icon name="lucideSearch" class="w-3.5 h-3.5 text-white/30 absolute left-3 top-1/2 -translate-y-1/2"></ng-icon>
        <input type="text"
               [ngModel]="searchQuery()"
               (ngModelChange)="searchQuery.set($event)"
               placeholder="Search projects..."
               class="w-full pl-8 pr-3 py-1.5 bg-white/[0.03] border border-white/[0.06] rounded-xl text-xs text-white/80 placeholder-white/25 focus:outline-none focus:border-white/20 focus:bg-white/[0.06] transition-all" />
      </div>

      <!-- Project List -->
      <div class="flex-1 space-y-4 overflow-y-auto custom-scrollbar pr-1">
        
        <!-- My Projects / Recent Section -->
        <div *ngIf="selectedTab() === 'my_projects'">
          <div class="text-[10px] font-mono uppercase tracking-wider text-white/30 px-2 mb-2 flex items-center justify-between">
            <span>Recent</span>
            <span>{{ filteredDocuments().length }}</span>
          </div>

          <div *ngIf="filteredDocuments().length === 0" class="p-4 text-center text-xs text-white/30">
            No projects yet. Ingest a document or start a topic!
          </div>

          <div class="space-y-1.5">
            <div *ngFor="let doc of filteredDocuments()"
                 (click)="openDocument(doc.id)"
                 class="p-2.5 rounded-2xl border border-white/[0.05] hover:border-white/15 bg-white/[0.02] hover:bg-white/[0.06] transition-all cursor-pointer group flex items-start space-x-3">
              <div class="w-8 h-8 rounded-xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-white/60 group-hover:text-white shrink-0 mt-0.5">
                <ng-icon name="lucideFileText" class="w-4 h-4"></ng-icon>
              </div>
              <div class="flex-1 min-w-0">
                <h4 class="text-xs font-medium text-white/85 group-hover:text-white truncate transition-colors">
                  {{ doc.title }}
                </h4>
                <div class="flex items-center space-x-2 text-[10px] text-white/40 mt-1">
                  <span>{{ doc.entities ? doc.entities.length : 0 }} concepts</span>
                  <span>•</span>
                  <span class="font-mono text-[9px] uppercase px-1 rounded"
                        [ngClass]="doc.status === 'COMPLETED' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'">
                    {{ doc.status }}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Examples Section -->
        <div *ngIf="selectedTab() === 'examples'">
          <div class="text-[10px] font-mono uppercase tracking-wider text-white/30 px-2 mb-2">
            Curated Knowledge Maps
          </div>
          <div class="space-y-1.5">
            <div *ngFor="let preset of filteredPresets()"
                 (click)="selectPreset(preset)"
                 class="p-2.5 rounded-2xl border border-white/[0.05] hover:border-white/15 bg-white/[0.02] hover:bg-white/[0.06] transition-all cursor-pointer group flex items-start space-x-3">
              <div class="w-8 h-8 rounded-xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-white/60 group-hover:text-white shrink-0 mt-0.5">
                <ng-icon name="lucideSparkles" class="w-4 h-4"></ng-icon>
              </div>
              <div class="flex-1 min-w-0">
                <h4 class="text-xs font-medium text-white/85 group-hover:text-white truncate transition-colors">
                  {{ preset.title }}
                </h4>
                <p class="text-[10px] text-white/40 line-clamp-1 mt-0.5">{{ preset.description }}</p>
              </div>
            </div>
          </div>
        </div>

      </div>

    </aside>

    <!-- Center Main Content: LLM Prompt Box & Suggestions -->
    <main class="flex-1 h-full overflow-y-auto custom-scrollbar p-6 md:p-12 flex flex-col items-center justify-center">
      
      <div class="w-full max-w-2xl flex flex-col items-center">
        
        <!-- Hero Title -->
        <div class="w-full text-left mb-5">
          <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-white/95">
            Welcome to Trellis..
          </h1>
        </div>

        <!-- Big LLM Prompt Box Container -->
        <div class="w-full rounded-3xl border border-white/10 bg-[#0B101B]/95 shadow-2xl p-4 transition-all focus-within:border-white/25 focus-within:bg-[#0D1322]">
          
          <!-- Multiline Textarea -->
          <textarea [ngModel]="topicPrompt()"
                    (ngModelChange)="topicPrompt.set($event)"
                    (keydown)="onKeydown($event)"
                    rows="4"
                    placeholder="What topic would you like to explore?"
                    class="w-full bg-transparent border-0 text-sm md:text-base text-white/90 placeholder-white/30 focus:outline-none resize-none leading-relaxed"></textarea>

          <!-- Bottom Action Toolbar -->
          <div class="flex items-center justify-between pt-3 border-t border-white/[0.06] mt-2">
            
            <!-- Left Tool: Plus Button to Upload Document / PDF -->
            <button (click)="triggerPdfUpload(fileInput)"
                    title="Upload PDF or Document"
                    class="h-8 px-3 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] flex items-center space-x-1.5 text-xs text-white/70 hover:text-white transition-all">
              <ng-icon name="lucidePlus" class="w-4 h-4"></ng-icon>
              <span>Add PDF / Doc</span>
            </button>

            <!-- Right Tool: Send Action Button -->
            <button (click)="submitPrompt()"
                    [disabled]="!topicPrompt().trim() || isSubmitting()"
                    [ngClass]="topicPrompt().trim() && !isSubmitting() ? 'bg-white text-black hover:bg-white/90 shadow-md cursor-pointer' : 'bg-white/10 text-white/30 cursor-not-allowed'"
                    class="w-8 h-8 rounded-xl flex items-center justify-center transition-all">
              <ng-icon *ngIf="!isSubmitting()" name="lucideArrowUp" class="w-4 h-4"></ng-icon>
              <div *ngIf="isSubmitting()" class="w-3.5 h-3.5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
            </button>

          </div>

        </div>

        <!-- Suggested Topic Quick Chips Underneath -->
        <div class="w-full flex flex-wrap items-center gap-2 mt-4">
          <button *ngFor="let preset of presets"
                  (click)="selectPreset(preset)"
                  class="px-3.5 py-1.5 rounded-full border border-white/[0.06] bg-white/[0.02] hover:bg-white/[0.08] hover:border-white/20 text-xs text-white/60 hover:text-white/90 transition-all truncate max-w-xs flex items-center space-x-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-white/30"></span>
            <span class="truncate">{{ preset.title }}</span>
          </button>
        </div>

      </div>

    </main>

  </div>

</div>
